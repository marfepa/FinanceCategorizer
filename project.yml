name: FinanceCategorizer
options:
  bundleIdPrefix: com.mariofernandez
  deploymentTarget:
    iOS: "17.0"
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.10
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.2.0
configs:
  Debug: debug
  Release: release
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.20
targets:
  FinanceCategorizerIOS:
    type: application
    platform: iOS
    dependencies:
      - package: ZIPFoundation
    sources:
      - path: Apps/iOS
      - path: Shared
      - path: Platform/iOSUI
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mariofernandez.FinanceCategorizerIOS
        PRODUCT_NAME: FinanceCategorizerIOS
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Finance Categorizer
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: Finance Categorizer stores imported files and local data.
        INFOPLIST_KEY_NSSupportsAutomaticGraphicsSwitching: YES

  FinanceCategorizerMac:
    type: application
    platform: macOS
    dependencies:
      - package: ZIPFoundation
    sources:
      - path: Apps/macOS
      - path: Shared
      - path: Platform/macOSUI
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mariofernandez.FinanceCategorizerMac
        PRODUCT_NAME: FinanceCategorizerMac
        INFOPLIST_KEY_CFBundleDisplayName: Finance Categorizer
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES

  FinanceCategorizerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/UnitTests
    dependencies:
      - target: FinanceCategorizerIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mariofernandez.FinanceCategorizerTests
        PRODUCT_NAME: FinanceCategorizerTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/FinanceCategorizerIOS.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/FinanceCategorizerIOS
        BUNDLE_LOADER: $(TEST_HOST)

  FinanceCategorizerUITestsIOS:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests_iOS
    dependencies:
      - target: FinanceCategorizerIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mariofernandez.FinanceCategorizerUITestsIOS
        PRODUCT_NAME: FinanceCategorizerUITestsIOS
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FinanceCategorizerIOS

  FinanceCategorizerUITestsMac:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/UITests_macOS
    dependencies:
      - target: FinanceCategorizerMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mariofernandez.FinanceCategorizerUITestsMac
        PRODUCT_NAME: FinanceCategorizerUITestsMac
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FinanceCategorizerMac

schemes:
  FinanceCategorizerIOS:
    build:
      targets:
        FinanceCategorizerIOS: all
        FinanceCategorizerTests: [test]
        FinanceCategorizerUITestsIOS: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: FinanceCategorizerTests
        - name: FinanceCategorizerUITestsIOS

  FinanceCategorizerMac:
    build:
      targets:
        FinanceCategorizerMac: all
        FinanceCategorizerUITestsMac: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: FinanceCategorizerUITestsMac
